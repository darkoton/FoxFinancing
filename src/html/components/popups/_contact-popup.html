<div class="popup popup-contact">
  <div
    class="popup__body scroll-orange flex w-full max-w-[760px] flex-col rounded-[16px] border-[0.5px] border-white bg-gray-black p-[16px] md:p-[20px_42px] lg:p-[20px_56px]"
  >
    <button
      class="popup-close transition-hover mb-[16px] self-end text-[24px] text-orange hover:text-white"
      type="button"
    >
      <svg width="1em" height="1em">
        <use xlink:href="assets/sprites/sprite.symbol.svg#close"></use>
      </svg>
    </button>

    <div class="flex flex-col">
      <h3
        class="mb-[16px] text-center text-[20px] font-medium uppercase text-orange md:text-[24px]"
      >
        Заповніть форму
      </h3>

      <div class="mb-[24px] flex flex-wrap gap-[16px] md:mb-[32px]">
        <div class="flex w-full flex-col gap-[4px]">
          <label for="username" class="text-[14px] md:text-[16px]">
            Ваше ім’я
          </label>

          <input
            class="w-full rounded-[4px] border-[1px] border-[#373737] bg-[#212121] p-[16px] text-[14px] transition-[border] placeholder:text-white/60 focus:border-orange md:p-[17px_20px] md:text-[16px]"
            type="text"
            id="username"
            placeholder="Ваше ім’я"
            autocomplete="name"
          />
        </div>

        <div class="flex flex-[48.5%] flex-col gap-[4px]">
          <label for="phone" class="text-[14px] md:text-[16px]">
            Телефон
          </label>

          <input
            class="w-full rounded-[4px] border-[1px] border-[#373737] bg-[#212121] p-[16px] text-[14px] transition-[border] placeholder:text-white/60 focus:border-orange md:p-[17px_20px] md:text-[16px]"
            type="text"
            id="phone"
            placeholder="Телефон*"
            autocomplete="tel"
          />
        </div>

        <div class="flex flex-[48.5%] flex-col gap-[4px]">
          <label for="email" class="text-[14px] md:text-[16px]">
            Email
          </label>

          <input
            class="w-full rounded-[4px] border-[1px] border-[#373737] bg-[#212121] p-[16px] text-[14px] transition-[border] placeholder:text-white/60 focus:border-orange md:p-[17px_20px] md:text-[16px]"
            type="text"
            id="email"
            placeholder="Email"
            autocomplete="email"
          />
        </div>

        <div class="flex w-full flex-col gap-[4px]">
          <label for="email" class="text-[14px] md:text-[16px]">
            Коментар
          </label>

          <textarea
            class="w-full rounded-[4px] border-[1px] border-[#373737] bg-[#212121] p-[16px] text-[14px] transition-[border] placeholder:text-white/60 focus:border-orange md:p-[17px_20px] md:text-[16px]"
            id="comment"
            rows="7"
            placeholder="Коментар"
          ></textarea>
        </div>
      </div>

      <div class="flex flex-col items-center gap-[12px]">
        <button
          data-popup="popup-thanks"
          class="popup-close popup-open btn primary min-h-[48px] w-full text-[14px] md:text-[16px]"
        >
          Надіслати заявку
          <svg width="1em" height="1em" class="text-[14px] md:text-[16px]">
            <use
              xlink:href="assets/sprites/sprite.symbol.svg#nav-right"
            ></use>
          </svg>
        </button>

        <p class="text-center text-[12px] md:text-[14px]">
          Натискаючи кнопку “Надіслати заявку” Ви погоджуєтеся <br />
          з Політикою конфіденційності
        </p>
      </div>
    </div>
  </div>
</div>
